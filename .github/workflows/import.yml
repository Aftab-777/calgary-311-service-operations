name: Import verified project archive
on: workflow_dispatch
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and expand project
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import hashlib
          archive = Path('Calgary-311-Service-Operations.zip')
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == 'f7913288fb2f9e82df4c0b8b116df2024d081ba86fe42f12b9b8b6cba581abe9'
          root = Path.cwd().resolve()
          with ZipFile(archive) as z:
              for member in z.infolist():
                  parts = PurePosixPath(member.filename).parts
                  assert parts[0] == 'calgary-311-service-operations'
                  assert '..' not in parts and not PurePosixPath(member.filename).is_absolute()
                  relative = Path(*parts[1:])
                  if not parts[1:] or parts[1] == '.github':
                      continue
                  assert parts[1] not in ('.git', 'node_modules', '_site')
                  target = (root / relative).resolve()
                  assert target.is_relative_to(root)
                  if member.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(z.read(member))
          archive.unlink()
          PY
      - name: Commit project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add verified Calgary 311 analytics project"
          git push origin HEAD:main
